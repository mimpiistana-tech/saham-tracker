name: Paper-only server checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/stockradar-v3-paper-server-20261021]
permissions:
  contents: read
jobs:
  paper-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m py_compile paper_api.py auto_paper_rules.py auto_paper_engine.py auto_paper_journal.py
      - run: python -m unittest discover -s tests -p 'test_paper_server.py' -v
