name: Paper-only server checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/stockradar-v3-paper-server-20261021]
permissions:
  contents: read
jobs:
  paper-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m py_compile app.py server_scan.py daily_paper_runner.py intraday_paper.py paper_api.py auto_paper_rules.py auto_paper_engine.py auto_paper_journal.py
      - run: python -m unittest discover -s tests -p 'test_paper_server.py' -v
      - run: python -m unittest discover -s tests -p 'test_paper_storage.py' -v
      - run: python -m unittest discover -s tests -p 'test_paper_disk_probe.py' -v
      - run: python -m unittest discover -s tests -p 'test_server_scan_schedule.py' -v
      - run: python -m unittest discover -s tests -p 'test_scan_bootstrap.py' -v
      - run: python -m unittest discover -s tests -p 'test_daily_paper_logic.py' -v
      - run: python -m unittest discover -s tests -p 'test_daily_paper_runner.py' -v
      - run: python -m unittest discover -s tests -p 'test_entry_diagnostics.py' -v
      - run: python -m unittest discover -s tests -p 'test_intraday_paper.py' -v
      - name: Validate frontend syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html)
          assert scripts
          for i,src in enumerate(scripts):
              Path('/tmp/stockradar_'+str(i)+'.js').write_text(src,encoding='utf-8')
          PY
          for f in /tmp/stockradar_*.js; do node --check "$f"; done
