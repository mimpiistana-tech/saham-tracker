name: StockRadar paper safety tests
on:
  push:
    branches:
      - stockradar-v2-fast-scan-20261012
  workflow_dispatch:
jobs:
  paper-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Test rules and security without broker access
        env:
          AUTO_PAPER_WRITE_ENABLED: '0'
        run: python -m unittest -v test_auto_paper_rules test_auto_paper_auth
