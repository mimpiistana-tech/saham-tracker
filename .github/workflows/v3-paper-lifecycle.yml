name: StockRadar V3 paper lifecycle tests
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  v3-paper-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated V3 paper state-machine tests
        run: python -m unittest -v test_v3_full_paper_cycle
